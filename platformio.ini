; Blink + self-updating OTA test firmware for ESP32.
;
; Version and blink rate are injected by scripts/version.py from environment
; variables, so the same source builds every release:
;   FW_VERSION=1.0.1 BLINK_MS=200 pio run
; Use tools/release.sh to build + publish a release.

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; default.csv = two 1.25MB OTA slots (app0/app1) + otadata, required for rollback
board_build.partitions = default.csv
extra_scripts = pre:scripts/version.py
